<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Machine</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Profile CSS Generator</h1>

<div class="form-section">

    <label>
        Background Color
        <input
            type="text"
            id="bgColor"
            placeholder="#1A1A1A">
    </label>
    <div class="error" id="bgColorError"></div>

    <label>
        OR Background Image URL
        <input
            type="text"
            id="bgImage"
            placeholder="https://example.com/image.jpg">
    </label>

    <label>
        Header Color
        <input
            type="text"
            id="headerColor"
            placeholder="#2B2B2B">
    </label>
    <div class="error" id="headerColorError"></div>

    <label>
        Main Box Color
        <input
            type="text"
            id="mainBoxColor"
            placeholder="#333333">
    </label>
    <div class="error" id="mainBoxColorError"></div>

    <label>
        Toolbar Text Color
        <input
            type="text"
            id="toolbarTextColor"
            placeholder="#FFFFFF">
    </label>
    <div class="error" id="toolbarTextColorError"></div>

</div>

<button id="generateBtn">
    Generate CSS
</button>

<textarea
    id="cssOutput"
    rows="30"
    readonly
    placeholder="Generated CSS will appear here...">
</textarea>
    
<script src="profile-machine.js"></script>

</body>
</html>
