<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Machine</title>

    <script defer src="js/profile-machine.js"></script>
</head>
<body>

    <h1>Profile Machine</h1>

    <form id="generator-form">

        <div>
            <label for="body-bg">Body Background</label>
            <input
                type="text"
                id="body-bg"
                placeholder="hex or url">
            <input
                type="color"
                data-target="body-bg"
                value="#000000"
            >
        </div>

        <div>
            <label for="bg-main">Main Background</label>
            <input
                type="text"
                id="bg-main"
                placeholder="#222222">
            <input
                type="color"
                data-target="bg-main"
                value="#000000"
            >
        </div>

        <div>
            <label for="bg-accent">Accent Background</label>
            <input
                type="text"
                id="bg-accent"
                placeholder="#444444">
            <input
                type="color"
                data-target="bg-accent"
                value="#000000"
            >
        </div>

        <div>
            <label for="text-color">Text Color</label>
            <input
                type="text"
                id="text-color"
                placeholder="#ffffff">
            <input
                type="color"
                data-target="text-color"
                value="#000000"
            >
        </div>

        <div>
            <label for="text-accent">Text Accent Color</label>
            <input
                type="text"
                id="text-accent"
                placeholder="#cccccc">
            <input
                type="color"
                data-target="text-accent"
                value="#000000"
            >
        </div>

        <button type="button" id="generate-btn">
            Generate CSS
        </button>

    </form>

    <hr>

    <h2>Generated Variables</h2>

    <textarea
        id="output"
        rows="12"
        cols="80"
        readonly
    ></textarea>

</body>
</html>
